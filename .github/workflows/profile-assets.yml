name: Generate Profile Assets

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make sure the output folder exists
        run: mkdir -p dist

      - name: Generate snake animation SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: mitulupadhyay
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate GitHub stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=mitulupadhyay&show_icons=true&theme=tokyonight&hide_border=true&count_private=true"
          path: dist/github-stats.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=mitulupadhyay&layout=compact&theme=tokyonight&hide_border=true"
          path: dist/github-top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Generate streak stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=mitulupadhyay&theme=tokyonight&hide_border=true"
          path: dist/github-streak.svg
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}